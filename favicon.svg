<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#181534"/>
    </linearGradient>

    <!-- Sun Bloom -->
    <radialGradient id="sunGlow" cx="24%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet Bloom -->
    <radialGradient id="violetGlow" cx="76%" cy="76%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Note Aurora Gradient -->
    <linearGradient id="noteGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="68%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Border Specular Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base (Apple style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sunGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#violetGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Top-Left Radiant Sun (Daytime Weather) -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" fill-opacity="0.25"/>
    <circle cx="0" cy="0" r="20" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="0" cy="0" r="14" fill="#fef08a"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="3 4" stroke-opacity="0.7"/>
  </g>

  <!-- Bottom-Right Moon Crescent (Night Atmosphere) -->
  <path d="M 400 380 A 28 28 0 1 1 368 412 A 20 20 0 0 0 400 380 Z" fill="#c084fc" fill-opacity="0.8"/>

  <!-- Left Cyan Acoustic Soundwaves -->
  <path d="M 152 226 A 48 48 0 0 0 152 286" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 128 206 A 78 78 0 0 0 128 306" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Right Violet Acoustic Soundwaves -->
  <path d="M 360 226 A 48 48 0 0 1 360 286" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M 384 206 A 78 78 0 0 1 384 306" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Central Double Music Note -->
  <!-- Upper Connecting Beam -->
  <path d="M 215 160 L 325 135 L 325 170 L 215 195 Z" fill="url(#noteGrad)"/>
  <!-- Specular highlight on beam -->
  <line x1="216" y1="161" x2="324" y2="136" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Left Stem -->
  <rect x="215" y="160" width="16" height="155" rx="8" fill="url(#noteGrad)"/>
  <!-- Left Note Head -->
  <ellipse cx="188" cy="315" rx="38" ry="27" transform="rotate(-24 188 315)" fill="url(#noteGrad)"/>
  <ellipse cx="184" cy="311" rx="22" ry="14" transform="rotate(-24 184 311)" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Right Stem -->
  <rect x="309" y="135" width="16" height="150" rx="8" fill="url(#noteGrad)"/>
  <!-- Right Note Head -->
  <ellipse cx="282" cy="285" rx="38" ry="27" transform="rotate(-24 282 285)" fill="url(#noteGrad)"/>
  <ellipse cx="278" cy="281" rx="22" ry="14" transform="rotate(-24 278 281)" fill="#ffffff" fill-opacity="0.25"/>

</svg>
